<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار تحديد مستوى اللغة الإنجليزية - الأستاذ محمد طه</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #27ae60;
            --accent: #e67e22;
            --dark: #2d3436;
            --light: #f4f7f6;
            --white: #ffffff;
            --wa-color: #25D366;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--dark);
            padding: 15px;
        }

        #main-card {
            background: var(--white);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 { color: var(--primary); font-size: 1.6rem; margin-bottom: 10px; }
        .subtitle { color: #7f8c8d; margin-bottom: 20px; }

        .progress-container {
            background: var(--light);
            height: 8px;
            border-radius: 5px;
            margin-bottom: 25px;
        }
        #progress-bar {
            background: var(--secondary);
            width: 0%;
            height: 100%;
            transition: width 0.3s;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            direction: ltr;
        }

        .options-grid { display: grid; gap: 10px; direction: ltr; }
        
        .opt-btn {
            padding: 14px;
            border: 2px solid var(--light);
            border-radius: 10px;
            background: var(--white);
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            font-weight: 500;
        }

        .opt-btn:hover { background: #f0f0f0; border-color: var(--primary); }
        .correct { background: var(--secondary) !important; color: white; border-color: var(--secondary) !important; }
        .wrong { background: #e74c3c !important; color: white; border-color: #e74c3c !important; }

        #result-screen { display: none; }
        
        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border: 2px solid var(--light);
            border-radius: 10px;
            text-align: center;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1.1rem;
        }

        .level-tag {
            font-weight: bold;
            color: var(--accent);
            font-size: 1.4rem;
            margin: 15px 0;
            padding: 10px;
            background: #fff3e0;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div id="main-card">
    <div id="quiz-screen">
        <h1>English Placement Test</h1>
        <p class="subtitle">بإشراف الأستاذ محمد طه عطا المنان</p>
        
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>

        <div id="question" class="question-text">جاري تحميل السؤال...</div>
        <div id="options" class="options-grid"></div>
    </div>

    <div id="result-screen">
        <h2>أحسنتم يا متدربين! النتيجة النهائية:</h2>
        <div style="font-size: 3rem; font-weight: bold; color: var(--primary);" id="final-score">0</div>
        <div class="level-tag" id="level-desc">تحديد المستوى...</div>
        
        <p>لطفاً اكتبوا أسماءكم الثلاثية لاستلام التقرير</p>
        <input type="text" id="trainee-name" placeholder="ادخل الاسم هنا">
        
        <button class="btn-action" style="background:var(--wa-color);" onclick="sendWA()">
            إرسال النتيجة للواتساب
        </button>
    </div>
</div>

<audio id="s-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="s-wrong" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

<script>
    const quizData = [
        // المستوى المبتدئ - Beginner
        { q: "1. ____ name is Ahmed. I am from Sudan.", a: ["My", "Me", "I", "Mine"], c: 0 },
        { q: "2. They ____ football every Friday.", a: ["plays", "playing", "play", "played"], c: 2 },
        // المستوى فوق المبتدئ - Elementary
        { q: "3. Did you ____ the movie last night?", a: ["see", "saw", "seeing", "seen"], c: 0 },
        { q: "4. This is ____ interesting book I've ever read.", a: ["more", "most", "the most", "the more"], c: 2 },
        // المستوى المتوسط - Intermediate
        { q: "5. I ____ my homework when the lights went out.", a: ["do", "was doing", "did", "have done"], c: 1 },
        { q: "6. She has been working here ____ five years.", a: ["since", "for", "ago", "from"], c: 1 },
        // المستوى فوق المتوسط - Upper-Intermediate
        { q: "7. You ____ tell anyone our secret. It's confidential.", a: ["don't have to", "mustn't", "needn't", "won't"], c: 1 },
        { q: "8. I wish I ____ more time to finish the project.", a: ["have", "had", "will have", "having"], c: 1 },
        // المستوى المتقدم - Advanced
        { q: "9. If I ____ about the meeting, I would have attended.", a: ["knew", "had known", "would know", "have known"], c: 1 },
        { q: "10. ____ the difficult conditions, the team succeeded.", a: ["Despite", "In spite", "Although", "Even though"], c: 0 }
    ];

    let current = 0;
    let score = 0;

    function renderQuestion() {
        if (current >= quizData.length) { showResults(); return; }
        
        const q = quizData[current];
        document.getElementById("question").innerText = q.q;
        document.getElementById("progress-bar").style.width = ((current / quizData.length) * 100) + "%";
        
        const optsDiv = document.getElementById("options");
        optsDiv.innerHTML = "";
        
        q.a.forEach((opt, i) => {
            const btn = document.createElement("button");
            btn.className = "opt-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(i, btn);
            optsDiv.appendChild(btn);
        });
    }

    function checkAnswer(idx, btn) {
        const correct = quizData[current].c;
        const allBtns = document.querySelectorAll(".opt-btn");
        allBtns.forEach(b => b.disabled = true);

        if (idx === correct) {
            btn.classList.add("correct");
            document.getElementById("s-correct").play();
            score++;
        } else {
            btn.classList.add("wrong");
            allBtns[correct].classList.add("correct");
            document.getElementById("s-wrong").play();
        }

        setTimeout(() => {
            current++;
            renderQuestion();
        }, 1000);
    }

    function showResults() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";
        document.getElementById("final-score").innerText = score + " / 10";
        
        let level = "";
        if(score <= 3) level = "المستوى: مبتدئ (Beginner)";
        else if(score <= 5) level = "المستوى: فوق المبتدئ (Elementary)";
        else if(score <= 8) level = "المستوى: متوسط (Intermediate)";
        else level = "المستوى: متقدم (Advanced)";
        
        document.getElementById("level-desc").innerText = level;
    }

    function sendWA() {
        const name = document.getElementById("trainee-name").value;
        if(!name) { alert("لطفاً اكتبوا أسماءكم يا متدربين"); return; }
        const level = document.getElementById("level-desc").innerText;
        const msg = encodeURIComponent(`السلام عليكم أستاذ محمد طه\nأنا المتدرب(ة): ${name}\nأتممت اختبار تحديد المستوى بنجاح.\nالنتيجة: ${score}/10\n${level}`);
        window.open(`https://wa.me/249999240574?text=${msg}`);
    }

    renderQuestion();
</script>

</body>
</html>
